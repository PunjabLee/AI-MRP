server:
  port: 8080

spring:
  application:
    name: aimrp-system
  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/aimrp
    username: postgres
    password: postgres
  
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aimrp.system.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: aimrp-secret-key-for-jwt-token-generation-must-be-long-enough-2026
  expiration: 86400000

logging:
  level:
    com.aimrp: debug
