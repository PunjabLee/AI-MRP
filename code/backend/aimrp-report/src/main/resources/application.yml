# AI MRP 报表服务配置
spring:
  application:
    name: aimrp-report
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimrp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  config:
    import: optional:file:./application-${spring.profiles.active}.yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aimrp.report.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8093}

spring:
  cloud:
    discovery:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
