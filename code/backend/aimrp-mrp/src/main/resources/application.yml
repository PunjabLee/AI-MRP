# AI MRP 计算服务配置
spring:
  application:
    name: aimrp-mrp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimrp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  config:
    import: optional:file:./application-${spring.profiles.active}.yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aimrp.mrp.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 默认单体模式配置
server:
  port: ${SERVER_PORT:8083}

spring:
  cloud:
    discovery:
      enabled: false

# MRP 计算配置
mrp:
  planning:
    horizon: 90
    start-date: today
    time-bucket: DAY
    allow-negative: false
  calculation:
    batch-size: 1000
    timeout: 300000
  suggestion:
    auto-convert: false

logging:
  level:
    com.aimrp: debug

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
