# AI MRP 对话服务配置
spring:
  application:
    name: aimrp-conversation
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimrp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  config:
    import: optional:file:./application-${spring.profiles.active}.yml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aimrp.conversation.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8095}

spring:
  cloud:
    discovery:
      enabled: false

# AI 配置
ai:
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
