server:
  port: 8080

spring:
  application:
    name: aimrp-demand
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/aimrp
    username: postgres
    password: postgres

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aimrp.demand.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true
