# 微服务模式配置
# 使用方式: spring.profiles.active=microservice
# 需要配合 Nacos 使用

spring:
  cloud:
    # 微服务模式启用服务发现
    discovery:
      enabled: true
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:production}
        group: ${NACOS_GROUP:AIMRP_GROUP}
        weight: 1
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:production}
        group: ${NACOS_GROUP:AIMRP_GROUP}
        file-extension: yml
    # Sentinel 熔断降级
    sentinel:
      enabled: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      eager: true

# Sentinel 配置
sentinel:
  # 流控规则配置
  flow:
    enabled: true
  # 熔断规则配置
  circuitbreaker:
    enabled: true
  # 参数配置
  config:
    # 取消控制台懒加载
    eager: true

# Seata 分布式事务配置
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_GROUP:my_test_tx_group}
  service:
    vgroup-mapping:
      ${SEATA_TX_GROUP:my_test_tx_group}: ${SEATA_SERVER:default}
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:production}
      group: ${NACOS_GROUP:AIMRP_GROUP}

# 微服务模式配置
aimrp:
  microservice:
    enabled: true
    service-name: ${spring.application.name}

# Actuator 配置 (Sentinel)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,sentinel
  endpoint:
    health:
      show-details: always
    sentinel:
      enabled: true
